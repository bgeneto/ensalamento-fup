services:
  # Main Streamlit application
  ensalamento:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ensalamento
    hostname: ensalamento
    restart: unless-stopped
    init: true
    ports:
      - "8504:8501"
    env_file:
      - .env
    environment:
      # Keep all default runtime writes below the persistent /app/data mount.
      DATABASE_URL: "${DATABASE_URL:-sqlite:///./data/ensalamento.db}"
      LOGS_DIR: /app/data/logs
    networks:
      - proxy

    volumes:
      # SQLite, reports, logs, and file-backed runtime settings survive image
      # rebuilds and container replacement because the host owns this tree.
      - type: bind
        source: ./data
        target: /app/data
      # Streamlit configuration and authentication settings also stay on the
      # host. Read-only prevents the container from changing credentials.
      - type: bind
        source: ./.streamlit
        target: /app/.streamlit
        read_only: true

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Security settings
    security_opt:
      - no-new-privileges:true

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1024M

    # Run container as host user for correct volume permissions
    # Replace 1000 with your actual host user UID (run 'id -u' on host)
    user: "${HOST_UID:-1000}:${HOST_UID:-1000}"

  # Documentation Server
  docs:
    build:
      context: .
      dockerfile: Dockerfile
      target: docs
    container_name: ensalamento-docs
    restart: unless-stopped
    init: true
    ports:
      - "8000:80"
    networks:
      - proxy

networks:
  proxy:
    external: true
